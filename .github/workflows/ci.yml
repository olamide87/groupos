name: GroupOS CI

on:
  push:
    branches: [main, feat/standalone-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: API tests, typecheck, and web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck API
        run: npx tsc --noEmit -p apps/api/tsconfig.json
      - name: Test API
        run: npm run test -w @groupos/api
      - name: Build web
        run: npm run build -w @groupos/web
